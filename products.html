
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản phẩm - BakeMate</title>

  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="site-header__logo-link">
                <img src="images/logo.jpg" alt="Logo BakeMate"
                     class="site-header__logo-img">
                <span class="site-header__logo-text">Bake<span>Mate</span></span>
            </a>

            <nav class="site-header__nav" aria-label="Điều hướng chính">
                <ul class="site-header__menu">
                    <li class="site-header__menu-item">
                        <a href="index.html" class="site-header__menu-link">Trang chủ</a>
                    </li>
                    <li class="site-header__menu-item">
                        <a href="products.html"
                           class="site-header__menu-link active">Sản phẩm</a>
                    </li>
                    <li class="site-header__menu-item">
                        <a href="about.html" class="site-header__menu-link">Giới thiệu</a>
                    </li>
                </ul>
            </nav>

            <div class="site-header__actions">
                <form class="site-header__search" id="product-search-form" role="search">
                    <input type="search"
                           id="product-search"
                           name="q"
                           placeholder="Tìm nguyên liệu, công thức..."
                           class="site-header__search-input">
                    <button type="submit" class="site-header__search-btn">Tìm</button>
                </form>
                <a href="products.html" class="site-header__cart"
                   aria-label="Giỏ hàng">
                    <span class="site-header__cart-icon">🛒</span>
                </a>
            </div>
        </div>
    </header>

    <!-- DANH SÁCH SẢN PHẨM -->
    <!-- Dán phần danh sách 9 sản phẩm từ index.html vào đây -->
    <main class="site-main">
        <section class="products-section" id="san-pham-noi-bat">
            <h1 class="products-section__title">Danh sách nguyên liệu làm bánh</h1>
            <p class="products-section__desc">
                Lựa chọn nguyên liệu phù hợp cho những chiếc bánh thơm ngon tại nhà.
            </p>
            <!-- KHU VỰC LỌC VÀ SẮP XẾP SẢN PHẨM -->
            <div class="product-controls">

                <div class="product-controls__group">
                    <label for="category-filter">Lọc theo danh mục</label>
                    <select id="category-filter">
                        <option value="all">Tất cả danh mục</option>
                        <option value="Nguyên liệu">Nguyên liệu</option>
                        <option value="Dụng cụ">Dụng cụ</option>
                    </select>
                </div>

                <div class="product-controls__group">
                    <label for="price-sort">Sắp xếp theo giá</label>
                    <select id="price-sort">
                        <option value="default">Mặc định</option>
                        <option value="asc">Giá thấp đến cao</option>
                        <option value="desc">Giá cao đến thấp</option>
                    </select>
                </div>

            </div>

            <p id="product-result-count" class="product-result-count"
               aria-live="polite"></p>

            <div class="product-grid" id="product-list">
                <!-- Danh sách sản phẩm sẽ được JavaScript hiển thị -->
            </div>

            <p id="no-products-message" class="no-products-message" hidden>
                Không tìm thấy sản phẩm phù hợp.
            </p>
            </article>

            </div>

        </section>
    </main>
    <script src="js/products.js"></script>
    <script src="js/search-filter.js"></script>
</body>
</html>
